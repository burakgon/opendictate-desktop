name: Release

# Push a tag such as v0.2.0 to release: a draft release is created with that version's section of
# CHANGELOG.md, every platform is built and uploaded (with signed updater artifacts and
# latest.json, which running copies of OpenDictate check for updates), and the release is
# published once all builds have succeeded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run it on a tag to rebuild that release

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # This version's section of the changelog (without its heading).
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ && f { exit } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." > notes.md
          printf '\nInstallation notes: see the [README](https://github.com/%s#install). OpenDictate %s and later update themselves.\n' "${{ github.repository }}" "$version" >> notes.md
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases" -f tag_name="$TAG" -f name="OpenDictate $TAG" -F draft=true -F body=@notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Updates are signed with the key in these secrets; without it the build has no updater files.
      - name: Updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this release can't be installed as an update."
          fi
      # Signed with a Developer ID and notarized by Apple when these repository secrets exist
      # (see "Signed macOS builds" in CONTRIBUTING.md); otherwise the app is ad-hoc signed.
      - name: macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing secrets: the macOS build is ad-hoc signed and not notarized."
            exit 0
          fi
          cert=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '[:space:]')
          # Say so plainly when the certificate is about to expire (a month ahead) or has expired.
          renew="renew it by running scripts/macos-renew-certificate.sh on a Mac"
          leaf=$(printf '%s' "$cert" | base64 --decode | /usr/bin/openssl pkcs12 -nokeys -clcerts -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null || true)
          if [ -n "$leaf" ]; then
            if ! printf '%s\n' "$leaf" | openssl x509 -noout -checkend 0 >/dev/null; then
              echo "::error::The Developer ID certificate in APPLE_CERTIFICATE has expired: $renew."
              exit 1
            elif ! printf '%s\n' "$leaf" | openssl x509 -noout -checkend 2592000 >/dev/null; then
              echo "::warning::The Developer ID certificate expires on $(printf '%s\n' "$leaf" | openssl x509 -noout -enddate | cut -d= -f2): $renew."
            fi
          fi
          {
            echo "APPLE_CERTIFICATE=$cert"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            # An app-specific password (account.apple.com → Sign-In and Security).
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No notarization secrets (APPLE_API_* or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID): the macOS build is signed but not notarized."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
          # latest.json is written once, after every build (publish-release): builds merging their
          # own entries into it can drop each other's when they finish at the same time.
          includeUpdaterJson: false

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/latest-json.sh "$TAG"
      # "legacy": the newest version becomes the latest release, also when an older tag is rebuilt.
      - name: Publish
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" -F draft=false -f make_latest=legacy --jq '.html_url'
